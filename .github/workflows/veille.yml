name: Veille alternance

on:
  schedule:
    # Tous les jours a 8h, heure de Paris, ete comme hiver.
    # GitHub ne raisonne qu'en UTC : 8h a Paris = 06:00 UTC l'ete, 07:00 UTC
    # l'hiver. On declenche donc aux deux heures, et veille.py ne fait le
    # passage qu'une fois, a la premiere heure ou il est au moins 8h a Paris.
    # Aucun changement a faire aux changements d'heure.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:        # bouton "Run workflow" pour un scan a la demande

permissions:
  contents: write           # necessaire pour reecrire etat.json et offres.json

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer la dependance
        run: pip install requests

      - name: Lancer la veille
        env:
          MAIL_EXPEDITEUR: ${{ secrets.MAIL_EXPEDITEUR }}
          MAIL_DESTINATAIRE: ${{ secrets.MAIL_DESTINATAIRE }}
          MAIL_MOT_DE_PASSE: ${{ secrets.MAIL_MOT_DE_PASSE }}
          URL_SUIVI: ${{ secrets.URL_SUIVI }}
        run: python veille.py

      - name: Enregistrer les offres et les annonces deja vues
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add etat.json offres.json veille.log || true
          if git diff --staged --quiet; then
            echo "Rien de nouveau a enregistrer."
          else
            git commit -m "Passage du $(date -u '+%d/%m/%Y %H:%M UTC')"
            git pull --rebase --autostash || true
            git push
          fi
